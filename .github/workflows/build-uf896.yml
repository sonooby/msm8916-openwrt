name: Build UF896 OpenWrt

on:
  push:
    branches:
      - thwc-uf896-openwrt-25.12
    paths:
      - 'msm89xx/**'
      - 'packages/**'
      - 'diffconfigs/uf896'
      - 'scripts/**'
      - 'devenv/**'
      - '.github/workflows/build-uf896.yml'
  workflow_dispatch:

concurrency:
  group: uf896-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Fast preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate UF896 sources
        shell: bash
        run: |
          set -euo pipefail

          ISO_B64=packages/uci-usb-gadget/files/UF896_TOOLS.iso.gz.b64
          PKG_MK=packages/uci-usb-gadget/Makefile
          EXPECTED_SHA=18ff19b550161bdafe3d1cb279eda983a7be00dc63fe5ebe6249098ef6384e0e
          EXPECTED_SIZE=2097152
          MIN_CD_SIZE=614400

          required_files=(
            "$ISO_B64"
            "$PKG_MK"
            packages/uci-usb-gadget/files/usb-gadget.sh
            packages/uci-usb-gadget/files/uf896-usb-mode
            packages/uci-usb-gadget/files/uf896-zerocd
            packages/uci-usb-gadget/files/usb-gadget.init
            packages/uci-usb-gadget/files/usb-zerocd.init
            packages/uci-usb-gadget/files/usbgadget.config
            diffconfigs/uf896
            msm89xx/image/msm8916.mk
          )

          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file" >&2; exit 1; }
          done

          echo 'Checking shell syntax...'
          for file in \
            packages/uci-usb-gadget/files/usb-gadget.sh \
            packages/uci-usb-gadget/files/uf896-usb-mode \
            packages/uci-usb-gadget/files/uf896-zerocd \
            packages/uci-usb-gadget/files/usb-gadget.init \
            packages/uci-usb-gadget/files/usb-zerocd.init; do
            sh -n "$file"
          done

          echo 'Checking embedded UF896_TOOLS image...'
          base64 -d "$ISO_B64" > /tmp/UF896_TOOLS.iso.gz
          gzip -t /tmp/UF896_TOOLS.iso.gz
          gzip -dc /tmp/UF896_TOOLS.iso.gz > /tmp/UF896_TOOLS.iso
          echo "$EXPECTED_SHA  /tmp/UF896_TOOLS.iso" | sha256sum -c -

          size=$(stat -c '%s' /tmp/UF896_TOOLS.iso)
          test "$size" -eq "$EXPECTED_SIZE" || {
            echo "UF896_TOOLS.iso size mismatch: got $size, expected $EXPECTED_SIZE" >&2
            exit 1
          }
          test "$size" -ge "$MIN_CD_SIZE" || {
            echo "UF896_TOOLS.iso is below mass-storage CD minimum: $size < $MIN_CD_SIZE" >&2
            exit 1
          }

          echo 'Checking package and target configuration...'
          grep -Fq "$EXPECTED_SHA" "$PKG_MK"
          grep -q '^\s*+kmod-usb-gadget-eth' "$PKG_MK"
          if grep -q '^\s*+kmod-usb-gadget-rndis' "$PKG_MK"; then
            echo 'Invalid dependency: kmod-usb-gadget-rndis does not exist in this OpenWrt tree' >&2
            exit 1
          fi

          grep -q '^CONFIG_TARGET_msm89xx_msm8916_DEVICE_thwc-uf896=y$' diffconfigs/uf896
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' diffconfigs/uf896
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' diffconfigs/uf896
          grep -q '^CONFIG_PACKAGE_ip-full=y$' diffconfigs/uf896
          grep -Fq 'define Device/thwc-uf896' msm89xx/image/msm8916.mk
          grep -Fq 'DEVICE_DTS := msm8916-uf896' msm89xx/image/msm8916.mk

          git diff --check
          echo 'UF896 fast preflight: PASS'

  build:
    name: Build firmware
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare host
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo -E ./devenv/dependencies.sh

      - name: Read configured OpenWrt version
        id: version
        run: |
          VERSION=$(grep '^OPENWRT_VERSION=' devenv/.env | cut -d= -f2)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building UF896 against $VERSION"

      - name: Clone OpenWrt
        run: |
          git clone --filter=blob:none https://git.openwrt.org/openwrt/openwrt.git openwrt
          git -C openwrt checkout "${{ steps.version.outputs.version }}"
          mkdir -p openwrt/dl

      - name: Cache OpenWrt source downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: uf896-dl-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ hashFiles('packages/**/Makefile', 'msm89xx/**/Makefile', 'diffconfigs/uf896') }}
          restore-keys: |
            uf896-dl-${{ runner.os }}-${{ steps.version.outputs.version }}-

      - name: Install MSM8916 BSP and project packages
        run: |
          rm -rf openwrt/target/linux/msm89xx
          cp -a msm89xx openwrt/target/linux/msm89xx
          rm -rf openwrt/package/msm8916
          cp -a packages openwrt/package/msm8916

          if [ -d openwrt-overlay ]; then
            cp -a openwrt-overlay/. openwrt/
          fi

          if [ -d openwrt-patches ]; then
            for p in openwrt-patches/*.patch; do
              [ -f "$p" ] || continue
              if patch -p1 -d openwrt --dry-run < "$p" >/dev/null 2>&1; then
                patch -p1 -d openwrt < "$p"
              fi
            done
          fi

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure UF896
        run: |
          cp diffconfigs/uf896 openwrt/.config
          cd openwrt
          make defconfig
          grep -q '^CONFIG_TARGET_msm89xx_msm8916_DEVICE_thwc-uf896=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config
          grep -q '^CONFIG_PACKAGE_ip-full=y$' .config

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -delete || true

      - name: Smoke-build USB gadget package
        working-directory: openwrt
        run: |
          make package/msm8916/uci-usb-gadget/compile -j"$(nproc)" V=s

      - name: Build firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../uf896-build.log

      - name: Show build failure context
        if: failure()
        shell: bash
        run: |
          if [ -f uf896-build.log ]; then
            echo '===== Last 400 lines of UF896 build ====='
            tail -n 400 uf896-build.log
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uf896-build-log-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: uf896-build.log

      - name: Verify UF896 output
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR=openwrt/bin/targets/msm89xx/msm8916
          test -d "$TARGET_DIR"
          ls -lah "$TARGET_DIR"

          BOOT=$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*thwc-uf896*squashfs-boot.img' -print -quit)
          INITRAMFS=$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*thwc-uf896-initramfs-boot.img' -print -quit)
          SYSTEM=$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*thwc-uf896*system.img' -print -quit)
          MANIFEST=$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*thwc-uf896.manifest' -print -quit)

          test -n "$BOOT"
          test -n "$INITRAMFS"
          test -n "$SYSTEM"
          test -n "$MANIFEST"

          grep -aFq 'thwc,uf896' "$BOOT"
          grep -aFq 'thwc,uf896' "$INITRAMFS"

          python3 - "$BOOT" "$INITRAMFS" <<'PY'
          import sys

          def cmdline(path):
              data = open(path, 'rb').read(1632)
              assert data[:8] == b'ANDROID!', path
              first = data[64:576].split(b'\0', 1)[0]
              extra = data[608:1632].split(b'\0', 1)[0]
              return (first + extra).decode('ascii', 'replace')

          normal = cmdline(sys.argv[1])
          ram = cmdline(sys.argv[2])
          print('normal cmdline:', normal)
          print('initramfs cmdline:', ram)
          assert 'root=/dev/mmcblk0p14' in normal
          assert 'rootfstype=squashfs' in normal
          assert 'root=' not in ram
          PY

          for pkg in \
            bind-dig ca-bundle coreutils-base64 curl ip-full \
            kmod-inet-diag kmod-netlink-diag kmod-nft-nat \
            kmod-nft-tproxy kmod-tun nftables-json \
            ucode ucode-mod-fs ucode-mod-uci; do
              grep -q "^${pkg} - " "$MANIFEST" || {
                echo "Missing required package in image: $pkg" >&2
                exit 1
              }
          done

          test -z "$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*thwc-uf896*firmware.zip' -print -quit)"
          test -z "$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*thwc-uf896*flash.sh' -print -quit)"

      - name: Verify published checksums
        working-directory: openwrt/bin/targets/msm89xx/msm8916
        run: sha256sum -c sha256sums

      - name: Upload UF896 firmware
        uses: actions/upload-artifact@v4
        with:
          name: uf896-openwrt-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            openwrt/bin/targets/msm89xx/msm8916/*thwc-uf896*
            openwrt/bin/targets/msm89xx/msm8916/*.buildinfo
            openwrt/bin/targets/msm89xx/msm8916/profiles.json
            openwrt/bin/targets/msm89xx/msm8916/sha256sums
